<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#12172B; --ink-soft:#3A4058; --backdrop:#EFEDE6; --panel:#FFFFFF; --line:#DEDAD0;
    --gold:#E8A33D; --gold-deep:#C97F1E; --green:#3C8C7C; --green-soft:#DCEFEA;
    --blue:#3E6FA8; --blue-soft:#DCE7F2; --red:#B0483F; --red-soft:#F5E2E0; --radius:10px;
    font-family:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body,html{margin:0;padding:0;}
  #app{background:var(--backdrop);color:var(--ink);min-height:100%;padding:0 0 60px 0;}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px;}
  header.top{background:var(--ink);color:#fff;padding:28px 20px 22px;}
  header.top .wrap{display:flex;flex-direction:column;gap:6px;}
  header.top h1{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:26px;margin:0;}
  header.top p{margin:0;color:#C7C9D6;font-size:14px;}
  .marquee{display:flex;gap:6px;margin-top:10px;}
  .marquee span{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px 1px rgba(232,163,61,.6);}
  nav.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
  nav.tabs .wrap{display:flex;gap:0;padding:0 20px;}
  nav.tabs button{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:13px;font-weight:600;background:none;border:none;padding:16px 18px 14px;cursor:pointer;color:var(--ink-soft);border-bottom:3px solid transparent;}
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--gold);}
  section{padding:22px 0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .card h2{font-family:'Oswald',sans-serif;font-size:17px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 14px;}
  label{font-size:13px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:5px;}
  input[type=text],input[type=password],input[type=number],select,textarea{
    width:100%;font-family:'Inter',sans-serif;font-size:15px;padding:10px 12px;
    border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:70px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .row > div{flex:1;min-width:150px;}
  button.btn{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-weight:600;font-size:13px;background:var(--gold);color:var(--ink);border:none;padding:12px 20px;border-radius:8px;cursor:pointer;}
  button.btn:hover{background:var(--gold-deep);}
  button.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  button.btn.small{padding:8px 14px;font-size:11px;}
  button.btn:disabled{opacity:.5;cursor:default;}
  .day-grid{display:flex;flex-direction:column;gap:8px;}
  .day-row{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .day-row .dnum{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;width:64px;flex-shrink:0;}
  .day-row .dnum small{display:block;font-family:'Inter',sans-serif;font-weight:500;color:var(--ink-soft);font-size:11px;text-transform:uppercase;}
  .venue-group{display:flex;align-items:center;gap:6px;}
  .venue-group .vlabel{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink-soft);width:38px;}
  .bulb{width:48px;text-align:center;padding:7px 0;border:1px solid var(--line);border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;background:#fff;color:var(--ink-soft);user-select:none;}
  .bulb.on.arena{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 0 0 3px var(--green-soft);}
  .bulb.on.cc{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 3px var(--blue-soft);}
  .status{font-size:13px;margin-top:10px;min-height:18px;}
  .status.ok{color:var(--green);}
  .status.err{color:var(--red);}
  .gate{max-width:340px;}
  .subtabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .subtabs button{font-size:12px;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--ink-soft);}
  .subtabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  table.grid-table{border-collapse:collapse;width:100%;font-size:12px;}
  table.grid-table th,table.grid-table td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap;}
  table.grid-table th{background:var(--ink);color:#fff;font-family:'Oswald',sans-serif;font-weight:500;}
  table.grid-table td.name-cell{text-align:left;font-weight:600;position:sticky;left:0;background:#fff;}
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
  .mark-am{color:var(--green);font-weight:700;}
  .mark-pm{color:var(--gold-deep);font-weight:700;}
  ul.result-list{list-style:none;margin:0;padding:0;}
  ul.result-list li{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;}
  ul.result-list li:last-child{border-bottom:none;}
  .empty-note{color:var(--ink-soft);font-size:14px;padding:8px 0;}
  .count-badge{font-family:'Oswald',sans-serif;font-size:13px;background:var(--ink);color:#fff;padding:3px 10px;border-radius:20px;}
  .slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:640px){.slot-grid{grid-template-columns:1fr;}}
  .slot-card{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;}
  .slot-card.arena{border-top:4px solid var(--green);}
  .slot-card.cc{border-top:4px solid var(--blue);}
  .slot-card h3{font-family:'Oswald',sans-serif;font-size:14px;text-transform:uppercase;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;}
  .fill-line{font-size:13px;margin-bottom:8px;color:var(--ink-soft);}
  .fill-line.short{color:var(--red);font-weight:700;}
  .fill-line.met{color:var(--green);font-weight:700;}
  .event-tag{font-size:11px;background:var(--gold);color:var(--ink);padding:2px 8px;border-radius:12px;font-weight:700;}
  details summary{cursor:pointer;font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:4px;}
  .events-table{width:100%;border-collapse:collapse;font-size:13px;}
  .events-table th,.events-table td{border:1px solid var(--line);padding:8px;text-align:left;}
  .events-table th{background:var(--ink);color:#fff;font-family:'Oswald',sans-serif;font-weight:500;font-size:11px;text-transform:uppercase;}
  .setup-banner{background:var(--red-soft);border:1px solid var(--red);color:var(--red);padding:14px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;}
  .setup-banner code{background:#fff;padding:2px 6px;border-radius:4px;}
</style>

<div id="app">
  <header class="top">
    <div class="wrap">
      <h1>Event Staff Availability</h1>
      <p>Submit your availability for the Arena and Convention Center, or view who's available for scheduling.</p>
      <div class="marquee"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
  </header>
  <nav class="tabs">
    <div class="wrap">
      <button id="tab-employee" class="active">Submit Availability</button>
      <button id="tab-admin">Scheduling View</button>
    </div>
  </nav>
  <div class="wrap">
    <section id="view-employee"></section>
    <section id="view-admin" style="display:none;"></section>
  </div>
</div>

<script>
(function(){
  // ============= CONFIG: paste your Apps Script Web App URL here =============
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyiYuJSSm3VReeVnkO9rF5kqoQo8aJqRof1XpC8Q-xlOrFvMZVFDy6aBLzvy3Jgp-Ax/exec';
  // =============================================================================

  const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const ADMIN_PIN_DEFAULT = '2600';
  const VENUES = [{id:'arena',label:'Arena'},{id:'cc',label:'CC'}];
  const SHIFTS = ['AM','PM'];
  const CONFIGURED = SCRIPT_URL.indexOf('PASTE_YOUR') === -1;

  function monthKey(y,m){ return y+'-'+String(m+1).padStart(2,'0'); }
  function monthLabel(y,m){ return new Date(y,m,1).toLocaleString('en-US',{month:'long',year:'numeric'}); }
  function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
  function slotKey(venue,shift){ return venue+shift; }
  function monthOptions(){
    const year = new Date().getFullYear();
    const months = [8,9,10,11]; // Sept, Oct, Nov, Dec
    return months.map(m => ({ y:year, m, key:monthKey(year,m), label:monthLabel(year,m) }));
  }

  async function apiGet(action, params){
    const url = new URL(SCRIPT_URL);
    url.searchParams.set('action', action);
    Object.keys(params||{}).forEach(k=>url.searchParams.set(k, params[k]));
    const res = await fetch(url);
    return res.json();
  }
  async function apiPost(payload){
    const res = await fetch(SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  function defaultSettings(){
    return {
      instructions: 'You must make yourself available for a minimum of 21 shifts this month, including 3 Saturdays and 3 Sundays. If you are unable to make a scheduled shift, you must call off by calling 508-929-0145 or emailing kallain@dcucenter.com.',
      pin: ADMIN_PIN_DEFAULT
    };
  }
  async function getSettings(){
    if(!CONFIGURED) return defaultSettings();
    try{ return await apiGet('getSettings'); } catch(e){ return defaultSettings(); }
  }
  async function saveSettings(s){ await apiPost({action:'saveSettings', settings:s}); }

  async function getAllRecords(mKey){
    if(!CONFIGURED) return [];
    try{
      const r = await apiGet('getAll', {month:mKey});
      return (r.records||[]).sort((a,b)=>a.name.localeCompare(b.name));
    }catch(e){ return []; }
  }
  async function saveAvailability(name, mKey, days){
    await apiPost({action:'saveAvailability', name:name, month:mKey, days:days});
  }
  async function getEvents(mKey){
    if(!CONFIGURED) return [];
    try{ const r = await apiGet('getEvents', {month:mKey}); return r.events||[]; }
    catch(e){ return []; }
  }
  async function saveEvents(mKey, events){ await apiPost({action:'saveEvents', month:mKey, events:events}); }

  function csvDownload(filename, rows){
    const csv = rows.map(r=>r.map(c=>{
      const s = String(c==null?'':c);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(',')).join('\n');
    const blob = new Blob([csv],{type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=filename; a.click();
    URL.revokeObjectURL(url);
  }

  function setupBanner(){
    return CONFIGURED ? '' : `<div class="setup-banner">This page isn't connected to a spreadsheet yet. Open the file and paste your Apps Script Web App URL into <code>SCRIPT_URL</code> near the top of the script.</div>`;
  }

  /* ---------------- EMPLOYEE VIEW ---------------- */
  const monthOpts = monthOptions();
  let empState = { monthIdx:0, name:'', days:{}, settings:null };
  const empRoot = document.getElementById('view-employee');

  function renderEmployeeView(){
    const mo = monthOpts[empState.monthIdx];
    const n = daysInMonth(mo.y, mo.m);
    let dayRows = '';
    for(let d=1; d<=n; d++){
      const wd = WEEKDAYS[new Date(mo.y, mo.m, d).getDay()];
      const on = empState.days[d]||{};
      dayRows += `<div class="day-row">
        <div class="dnum">${d}<small>${wd}</small></div>
        <div class="venue-group"><span class="vlabel">Arena</span>
          <div class="bulb arena ${on.arenaAM?'on arena':''}" data-day="${d}" data-slot="arenaAM">AM</div>
          <div class="bulb arena ${on.arenaPM?'on arena':''}" data-day="${d}" data-slot="arenaPM">PM</div>
        </div>
        <div class="venue-group"><span class="vlabel">CC</span>
          <div class="bulb cc ${on.ccAM?'on cc':''}" data-day="${d}" data-slot="ccAM">AM</div>
          <div class="bulb cc ${on.ccPM?'on cc':''}" data-day="${d}" data-slot="ccPM">PM</div>
        </div>
      </div>`;
    }
    empRoot.innerHTML = `
      ${setupBanner()}
      <div class="card">
        <h2>Your Details</h2>
        <div class="row">
          <div><label>Full name</label><input type="text" id="emp-name" placeholder="e.g. Jordan Smith" value="${empState.name}"></div>
          <div><label>Schedule month</label>
            <select id="emp-month">${monthOpts.map((o,i)=>`<option value="${i}" ${i===empState.monthIdx?'selected':''}>${o.label}</option>`).join('')}</select>
          </div>
        </div>
        <p class="empty-note">${empState.settings ? empState.settings.instructions : 'Loading...'}</p>
      </div>
      <div class="card">
        <h2>Mark every shift you're available for — ${mo.label}</h2>
        <p class="empty-note">Green = Arena, Blue = CC. Tap AM / PM for each venue you could work that day.</p>
        <div class="day-grid">${dayRows}</div>
        <button class="btn" id="emp-save" style="margin-top:16px;" ${CONFIGURED?'':'disabled'}>Save My Availability</button>
        <div class="status" id="emp-status"></div>
      </div>
    `;
    document.getElementById('emp-month').onchange = (e)=>{
      empState.monthIdx = parseInt(e.target.value);
      empState.days = {};
      renderEmployeeView();
      tryLoadExisting();
    };
    document.getElementById('emp-name').oninput = (e)=>{ empState.name = e.target.value; };
    document.getElementById('emp-name').onblur = tryLoadExisting;
    empRoot.querySelectorAll('.bulb').forEach(b=>{
      b.onclick = ()=>{
        const d = b.dataset.day, slot = b.dataset.slot;
        empState.days[d] = empState.days[d] || {};
        empState.days[d][slot] = !empState.days[d][slot];
        const venueClass = slot.startsWith('arena') ? 'arena' : 'cc';
        b.classList.toggle('on');
        b.classList.toggle(venueClass, true);
      };
    });
    document.getElementById('emp-save').onclick = saveEmployee;
  }

  async function tryLoadExisting(){
    if(!CONFIGURED || !empState.name || empState.name.trim().length<2) return;
    const mo = monthOpts[empState.monthIdx];
    const records = await getAllRecords(mo.key);
    const rec = records.find(r => r.name.trim().toLowerCase() === empState.name.trim().toLowerCase());
    if(rec){
      empState.days = rec.days || {};
      renderEmployeeView();
      const s = document.getElementById('emp-status');
      if(s){ s.textContent = 'Loaded your previous submission for '+mo.label+' — edit and save to update.'; s.className='status ok'; }
    }
  }

  async function saveEmployee(){
    const statusEl = document.getElementById('emp-status');
    if(!empState.name || empState.name.trim().length<2){
      statusEl.textContent = 'Please enter your name.'; statusEl.className='status err'; return;
    }
    const anySelected = Object.values(empState.days).some(d=>d.arenaAM||d.arenaPM||d.ccAM||d.ccPM);
    if(!anySelected){
      statusEl.textContent = 'Please mark at least one slot.'; statusEl.className='status err'; return;
    }
    const mo = monthOpts[empState.monthIdx];
    const saveBtn = document.getElementById('emp-save');
    saveBtn.disabled = true; statusEl.textContent = 'Saving...'; statusEl.className='status';
    try{
      await saveAvailability(empState.name.trim(), mo.key, empState.days);
      statusEl.textContent = 'Saved! Your availability for '+mo.label+' is on file.';
      statusEl.className = 'status ok';
    }catch(e){
      statusEl.textContent = 'Something went wrong saving — check your connection and try again.';
      statusEl.className = 'status err';
    }
    saveBtn.disabled = false;
  }

  /* ---------------- ADMIN VIEW ---------------- */
  const adminRoot = document.getElementById('view-admin');
  let adminState = { unlocked:false, monthIdx:0, subtab:'byday', settings:null, records:[], events:[], byDayDate:1, search:'', gridVenue:'arena' };

  function renderAdminGate(){
    adminRoot.innerHTML = `
      ${setupBanner()}
      <div class="card gate">
        <h2>Scheduling View</h2>
        <label>Enter admin PIN</label>
        <input type="password" id="admin-pin" placeholder="PIN">
        <button class="btn" id="admin-unlock" style="margin-top:12px;" ${CONFIGURED?'':'disabled'}>Unlock</button>
        <div class="status" id="admin-gate-status"></div>
      </div>
    `;
    const unlockBtn = document.getElementById('admin-unlock');
    if(unlockBtn) unlockBtn.onclick = async ()=>{
      const pin = document.getElementById('admin-pin').value;
      const settings = await getSettings();
      if(pin === settings.pin){
        adminState.unlocked = true; adminState.settings = settings; renderAdminView();
      }else{
        document.getElementById('admin-gate-status').textContent = 'Incorrect PIN.';
        document.getElementById('admin-gate-status').className = 'status err';
      }
    };
  }

  async function loadAdminData(){
    const mo = monthOpts[adminState.monthIdx];
    adminState.records = await getAllRecords(mo.key);
    adminState.events = await getEvents(mo.key);
  }

  async function renderAdminView(){
    if(!adminState.unlocked){ renderAdminGate(); return; }
    await loadAdminData();
    adminRoot.innerHTML = `
      <div class="card">
        <div class="row">
          <div><label>Month</label>
            <select id="admin-month">${monthOpts.map((o,i)=>`<option value="${i}" ${i===adminState.monthIdx?'selected':''}>${o.label}</option>`).join('')}</select>
          </div>
          <div style="display:flex;align-items:flex-end;"><span class="count-badge">${adminState.records.length} people submitted</span></div>
        </div>
        <div class="subtabs">
          <button data-t="byday" class="${adminState.subtab==='byday'?'active':''}">By Day</button>
          <button data-t="grid" class="${adminState.subtab==='grid'?'active':''}">Full Month Grid</button>
          <button data-t="events" class="${adminState.subtab==='events'?'active':''}">Event Needs</button>
          <button data-t="settings" class="${adminState.subtab==='settings'?'active':''}">Settings</button>
        </div>
        <div id="admin-subview"></div>
      </div>
    `;
    document.getElementById('admin-month').onchange = (e)=>{ adminState.monthIdx = parseInt(e.target.value); renderAdminView(); };
    adminRoot.querySelectorAll('.subtabs button').forEach(b=>{
      b.onclick = ()=>{ adminState.subtab = b.dataset.t; renderAdminSubview(); };
    });
    renderAdminSubview();
  }

  function renderAdminSubview(){
    document.querySelectorAll('.subtabs button').forEach(b=>b.classList.toggle('active', b.dataset.t===adminState.subtab));
    if(adminState.subtab==='byday') renderByDay();
    else if(adminState.subtab==='grid') renderFullGrid();
    else if(adminState.subtab==='events') renderEvents();
    else renderAdminSettings();
  }

  function eventFor(day, venue, shift){
    return adminState.events.find(e=>e.date==day && e.venue===venue && e.shift===shift);
  }

  function renderByDay(){
    const mo = monthOpts[adminState.monthIdx];
    const n = daysInMonth(mo.y, mo.m);
    const sub = document.getElementById('admin-subview');
    let dayOptions = '';
    for(let d=1; d<=n; d++){
      const wd = WEEKDAYS[new Date(mo.y, mo.m, d).getDay()];
      dayOptions += `<option value="${d}" ${d===adminState.byDayDate?'selected':''}>${d} (${wd})</option>`;
    }
    const day = adminState.byDayDate;

    function slotCard(venue, venueLabel, shift){
      const ev = eventFor(day, venue, shift);
      const slot = slotKey(venue, shift);
      const available = adminState.records.filter(r => r.days && r.days[day] && r.days[day][slot]);
      const filtered = available.filter(r => r.name.toLowerCase().includes(adminState.search.toLowerCase()));
      let fillLine = `${available.length} available`;
      let fillClass = '';
      if(ev && ev.guardsNeeded){
        const short = ev.guardsNeeded - available.length;
        fillLine = short > 0 ? `${available.length} available / ${ev.guardsNeeded} needed — short ${short}` : `${available.length} available / ${ev.guardsNeeded} needed — filled`;
        fillClass = short > 0 ? 'short' : 'met';
      }
      const listItems = filtered.length ? filtered.map(r=>`<li><span>${r.name}</span></li>`).join('') : '<div class="empty-note">Nobody available.</div>';
      return `
        <div class="slot-card ${venue}">
          <h3>${venueLabel} · ${shift} ${ev?`<span class="event-tag">${ev.name||'Event'}</span>`:''}</h3>
          <div class="fill-line ${fillClass}">${fillLine}${ev&&ev.supsNeeded?` · ${ev.supsNeeded} sups needed`:''}</div>
          <details><summary>View ${filtered.length} available</summary><ul class="result-list">${listItems}</ul></details>
          <button class="btn ghost small" data-export-venue="${venue}" data-export-shift="${shift}" style="margin-top:8px;">Export CSV</button>
        </div>`;
    }

    sub.innerHTML = `
      <div class="row" style="margin-top:16px;">
        <div><label>Date</label><select id="byday-date">${dayOptions}</select></div>
        <div><label>Search name</label><input type="text" id="byday-search" placeholder="Filter..." value="${adminState.search}"></div>
      </div>
      <div class="slot-grid">
        ${slotCard('arena','Arena','AM')}
        ${slotCard('arena','Arena','PM')}
        ${slotCard('cc','CC','AM')}
        ${slotCard('cc','CC','PM')}
      </div>
    `;
    document.getElementById('byday-date').onchange = (e)=>{ adminState.byDayDate = parseInt(e.target.value); renderByDay(); };
    document.getElementById('byday-search').oninput = (e)=>{ adminState.search = e.target.value; renderByDay(); };
    sub.querySelectorAll('[data-export-venue]').forEach(btn=>{
      btn.onclick = ()=>{
        const venue = btn.dataset.exportVenue, shift = btn.dataset.exportShift;
        const slot = slotKey(venue, shift);
        const rows = [['Name']];
        adminState.records.filter(r=>r.days && r.days[day] && r.days[day][slot]).forEach(r=>rows.push([r.name]));
        csvDownload(`available_${mo.key}_day${day}_${venue}${shift}.csv`, rows);
      };
    });
  }

  function renderFullGrid(){
    const mo = monthOpts[adminState.monthIdx];
    const n = daysInMonth(mo.y, mo.m);
    const sub = document.getElementById('admin-subview');
    const filtered = adminState.records.filter(r => r.name.toLowerCase().includes(adminState.search.toLowerCase()));
    const venue = adminState.gridVenue;

    let head = '<tr><th class="name-cell">Name</th>';
    for(let d=1; d<=n; d++){
      const wd = WEEKDAYS[new Date(mo.y, mo.m, d).getDay()];
      head += `<th>${d}<br><span style="font-weight:400;">${wd}</span></th>`;
    }
    head += '</tr>';

    let body = '';
    filtered.forEach(r=>{
      body += `<tr><td class="name-cell">${r.name}</td>`;
      for(let d=1; d<=n; d++){
        const dd = r.days[d] || {};
        let cell='';
        if(dd[slotKey(venue,'AM')]) cell += '<span class="mark-am">AM</span> ';
        if(dd[slotKey(venue,'PM')]) cell += '<span class="mark-pm">PM</span>';
        body += `<td>${cell||'—'}</td>`;
      }
      body += '</tr>';
    });

    sub.innerHTML = `
      <div class="row" style="margin-top:16px;">
        <div><label>Venue</label>
          <select id="grid-venue">${VENUES.map(v=>`<option value="${v.id}" ${v.id===venue?'selected':''}>${v.label}</option>`).join('')}</select>
        </div>
        <div><label>Search name</label><input type="text" id="grid-search" placeholder="Filter..." value="${adminState.search}"></div>
      </div>
      <div class="table-scroll">
        <table class="grid-table"><thead>${head}</thead><tbody>${body || `<tr><td class="name-cell" colspan="${n+1}">No submissions yet for ${mo.label}.</td></tr>`}</tbody></table>
      </div>
      <button class="btn ghost" id="grid-export" style="margin-top:12px;">Export CSV</button>
    `;
    document.getElementById('grid-venue').onchange = (e)=>{ adminState.gridVenue = e.target.value; renderFullGrid(); };
    document.getElementById('grid-search').oninput = (e)=>{ adminState.search = e.target.value; renderFullGrid(); };
    document.getElementById('grid-export').onclick = ()=>{
      const rows = [['Name', ...Array.from({length:n},(_,i)=>i+1).flatMap(d=>[`Day ${d} AM`,`Day ${d} PM`])]];
      filtered.forEach(r=>{
        const row=[r.name];
        for(let d=1; d<=n; d++){
          const dd = r.days[d] || {};
          row.push(dd[slotKey(venue,'AM')]?'Y':'', dd[slotKey(venue,'PM')]?'Y':'');
        }
        rows.push(row);
      });
      csvDownload(`full_availability_${mo.key}_${venue}.csv`, rows);
    };
  }

  function renderEvents(){
    const mo = monthOpts[adminState.monthIdx];
    const n = daysInMonth(mo.y, mo.m);
    const sub = document.getElementById('admin-subview');
    let dayOptions = '';
    for(let d=1; d<=n; d++){
      const wd = WEEKDAYS[new Date(mo.y, mo.m, d).getDay()];
      dayOptions += `<option value="${d}">${d} (${wd})</option>`;
    }
    const rowsHtml = adminState.events.length ? adminState.events
      .slice().sort((a,b)=>a.date-b.date)
      .map(e=>`<tr>
        <td>${e.date}</td><td>${e.venue==='arena'?'Arena':'CC'}</td><td>${e.shift}</td>
        <td>${e.name||''}</td><td>${e.guardsNeeded||0}</td><td>${e.supsNeeded||0}</td>
        <td><button class="btn ghost small" data-del="${e.id}">Remove</button></td>
      </tr>`).join('') : `<tr><td colspan="7" style="text-align:center;color:var(--ink-soft);">No events added for ${mo.label} yet.</td></tr>`;

    sub.innerHTML = `
      <div style="margin-top:16px;">
        <p class="empty-note">Add an event to set how many guards/sups are needed for a specific date, venue and shift. This shows up as a fill-progress indicator on the By Day view.</p>
        <div class="row">
          <div><label>Date</label><select id="ev-date">${dayOptions}</select></div>
          <div><label>Venue</label><select id="ev-venue">${VENUES.map(v=>`<option value="${v.id}">${v.label}</option>`).join('')}</select></div>
          <div><label>Shift</label><select id="ev-shift">${SHIFTS.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div>
        </div>
        <div class="row">
          <div><label>Event name</label><input type="text" id="ev-name" placeholder="e.g. Hockey Game"></div>
          <div><label>Guards needed</label><input type="number" id="ev-guards" min="0" placeholder="0"></div>
          <div><label>Sups needed</label><input type="number" id="ev-sups" min="0" placeholder="0"></div>
        </div>
        <button class="btn" id="ev-add">Add Event</button>
        <div class="status" id="ev-status"></div>
        <div class="table-scroll" style="margin-top:18px;">
          <table class="events-table">
            <thead><tr><th>Date</th><th>Venue</th><th>Shift</th><th>Event</th><th>Guards</th><th>Sups</th><th></th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      </div>
    `;
    document.getElementById('ev-add').onclick = async ()=>{
      const date = parseInt(document.getElementById('ev-date').value);
      const venue = document.getElementById('ev-venue').value;
      const shift = document.getElementById('ev-shift').value;
      const name = document.getElementById('ev-name').value.trim();
      const guardsNeeded = parseInt(document.getElementById('ev-guards').value) || 0;
      const supsNeeded = parseInt(document.getElementById('ev-sups').value) || 0;
      const existing = adminState.events.find(e=>e.date===date && e.venue===venue && e.shift===shift);
      if(existing){ existing.name=name; existing.guardsNeeded=guardsNeeded; existing.supsNeeded=supsNeeded; }
      else adminState.events.push({ id: Date.now()+'-'+Math.random().toString(36).slice(2,7), date, venue, shift, name, guardsNeeded, supsNeeded });
      await saveEvents(mo.key, adminState.events);
      const s = document.getElementById('ev-status'); s.textContent='Event saved.'; s.className='status ok';
      renderEvents();
    };
    sub.querySelectorAll('[data-del]').forEach(btn=>{
      btn.onclick = async ()=>{
        adminState.events = adminState.events.filter(e=>e.id !== btn.dataset.del);
        await saveEvents(mo.key, adminState.events);
        renderEvents();
      };
    });
  }

  function renderAdminSettings(){
    const sub = document.getElementById('admin-subview');
    sub.innerHTML = `
      <div style="margin-top:16px;">
        <label>Instructions shown to employees</label>
        <textarea id="settings-instructions">${adminState.settings.instructions}</textarea>
        <label style="margin-top:12px;">Admin PIN</label>
        <input type="text" id="settings-pin" value="${adminState.settings.pin}">
        <button class="btn" id="settings-save" style="margin-top:14px;">Save Settings</button>
        <div class="status" id="settings-status"></div>
      </div>
    `;
    document.getElementById('settings-save').onclick = async ()=>{
      const newSettings = {
        instructions: document.getElementById('settings-instructions').value,
        pin: document.getElementById('settings-pin').value || ADMIN_PIN_DEFAULT
      };
      await saveSettings(newSettings);
      adminState.settings = newSettings;
      const s = document.getElementById('settings-status');
      s.textContent = 'Settings saved.'; s.className='status ok';
    };
  }

  /* ---------------- TAB SWITCHING ---------------- */
  document.getElementById('tab-employee').onclick = ()=>{
    document.getElementById('tab-employee').classList.add('active');
    document.getElementById('tab-admin').classList.remove('active');
    document.getElementById('view-employee').style.display='block';
    document.getElementById('view-admin').style.display='none';
  };
  document.getElementById('tab-admin').onclick = ()=>{
    document.getElementById('tab-admin').classList.add('active');
    document.getElementById('tab-employee').classList.remove('active');
    document.getElementById('view-admin').style.display='block';
    document.getElementById('view-employee').style.display='none';
    if(!adminState.unlocked) renderAdminGate();
  };

  /* ---------------- INIT ---------------- */
  async function init(){
    empState.settings = await getSettings();
    renderEmployeeView();
    renderAdminGate();
  }
  init();
})();
</script>
